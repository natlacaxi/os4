name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        job: [host, boot-x86, boot-arm64, linux-x86_64, linux-arm64, android]
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/ci/${{ matrix.job }}.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.job }}
          path: out/
          if-no-files-found: ignore
